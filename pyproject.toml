[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plotdigitizer"
version = "0"
description = "Read the data back out of a picture of a plot: automatic axis, scale and data-point detection"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shashwot Paudel" }]
keywords = ["digitizer", "plot", "chart", "data-extraction", "graph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "numpy>=2.0",
    # headless build ONLY: the regular opencv-python wheel bundles its own Qt
    # plugins, which collide with PySide6's at import time.
    "opencv-python-headless>=4.10,<5",
    "Pillow>=10.0",
    # Supplies the preview chart, and the font files the label reader matches against.
    "matplotlib>=3.8",
    # Essentials rather than the full meta-package: only QtCore, QtGui and QtWidgets
    # are used, and Essentials is a fraction of the size. Anyone who already has the
    # full PySide6 has this too, since the meta-package depends on it.
    "PySide6-Essentials>=6.7",
]

[project.urls]
Homepage = "https://github.com/shashwotpaudel/plotdigitizer"
Documentation = "https://shashwotpaudel.github.io/plotdigitizer/"
Repository = "https://github.com/shashwotpaudel/plotdigitizer"
Issues = "https://github.com/shashwotpaudel/plotdigitizer/issues"

[project.optional-dependencies]
# Neural OCR upgrade, CPU-only execution provider.
cpu = ["onnxruntime>=1.18"]
# Neural OCR upgrade with CUDA execution provider (falls back to CPU at runtime).
gpu = ["onnxruntime-gpu[cuda,cudnn]>=1.20"]
# Optional torch acceleration for colour-distance maps and template matching.
torch = ["torch>=2.2"]
dev = ["pytest>=8.0"]

[project.scripts]
plotdigitizer = "plotdigitizer.cli:main"
plotdigitizer-gui = "plotdigitizer.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
